openapi: 3.0.3

info:
  title: Roadmap API
  description: REST API built with Node.js, Express and PostgreSQL
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Authentication
    description: Authentication and token management
  - name: Users
    description: User management

paths:

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                message: Login successful
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                  id: 28
                  name: Aman
                  email: admin@gmail.com
                  role: admin
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples: 
                invalidCredentials:
                  value: 
                    message: Invalid email or password
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Too many login attempts. Please try again later.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Internal Server Error
                  

  /auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Authentication
      security:
        - refreshCookie: []
      
      
      responses:
        '200':
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
              example:
                message: Token refreshed successfully
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                missing:
                  value:
                    message: Refresh token required
                invalid:
                  value:
                    message: Invalid or expired refresh token
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Internal Server Error


  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logout successful
        '401':
          description: Invalid or missing refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                missing:
                  value:
                    message: Refresh token required
                invalid:
                  value:
                    message: Invalid or expired refresh token
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Internal Server Error
  /users:
    post:
      tags:
        - Users
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: 819
                name: lucky
                email: lucky@gmail.com
                role: user
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                emailExists:
                  value:
                    message: A record with this value already exists
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Internal Server Error

    get:
      tags:
        - Users
      summary: Get users
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number for retrieving users
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1

        - name: limit
          in: query
          description: Number of users to return per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 10
  
        - name: role
          in: query
          description: Filter users by role
          required: false
          schema:
            type: string
            enum:
              - user
              - admin
            example: user

        - name: search
          in: query
          description: Search users by name or email
          required: false
          schema:
            type: string
            example: aman

        - name: sort
          in: query
          description: Field to sort users by
          required: false
          schema:
            type: string
            enum:
              - id
              - name
              - email
            default: id
            example: name

        - name: order
          in: query
          description: Order of sorting
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
            example: asc

      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsersResponse'
              example:
                users:
                  - id: 12
                    name: debolena
                    email: anu@gmail.com
                    role: user
                  - id: 34
                    name: black
                    email: black@gmail.com
                    role: user
                page: 1
                totalUsers: 634
                limit: 5
                totalPages: 127
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Authorization header missing or malformed
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                adminRequired:
                  value:
                    message: You do not have permission to perform this action
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Internal Server Error
          
  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            example: 12
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: 12
                name: tapwo
                email: anu@gmail.com
                role: admin
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Authorization header missing or malformed
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                notAuthorized:
                  value:
                    message: You do not have permission to perform this action
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                userNotFound:
                  value:
                    message: User not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Internal Server Error

    patch:
      tags:
        - Users
      summary: Update user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            example: 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              name: tapwo
              email: anu@gmail.com
              password: newpassword123
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: 12
                name: tapwo
                email: anu@gmail.com
                role: admin
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Authorization header missing or malformed
        '403':
          description: User is not authorized to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                adminRequired:
                  value:
                    message: You do not have permission to perform this action
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                userNotFound:
                  value:
                    message: User not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Internal Server Error

    delete:
      tags:
        - Users
      summary: Delete user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            example: 12
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User deleted successfully
                  user:
                    $ref: '#/components/schemas/UserResponse'
              example:
                message: User deleted successfully
                user:
                  id: 8
                  name: debolena
                  email: cdeb@gmail.com
                  role: admin
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Authorization header missing or malformed
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                notAuthorized:
                  value:
                    message: You do not have permission to perform this action
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                userNotFound:
                  value:
                    message: User not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Internal Server Error

  /users/{id}/role:
    patch:
      tags:
        - Users
      summary: Update user role
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            example: 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: User role updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User role updated successfully
                  user:
                    $ref: '#/components/schemas/UserResponse'
              example:
                message: User role updated successfully
                user:
                  id: 12
                  name: tapo
                  email: anu@gmail.com
                  role: admin
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Authorization header missing or malformed
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                adminRequired:
                  value:
                    message: You do not have permission to perform this action
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                userNotFound:
                  value:
                    message: User not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Internal Server Error

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken

  schemas:

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@gmail.com
        password:
          type: string
          minLength: 8
          example: password123

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          example: tapwo

        email:
          type: string
          format: email
          example: anu@gmail.com

        password:
          type: string
          minLength: 8
          example: newpassword123

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: lucky@gmail.com
        role:
          type: string
          enum:
            - user
            - admin
          example: user
    PaginatedUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          type: integer
          example: 1
        totalUsers:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 127
        limit:
          type: integer
          minimum: 1
          default: 10
          example: 10
    
    ValidationError:
      type: object
      properties:
        expected:
          type: string
          example: string
        code:
          type: string
          example: invalid_type
        path:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
          example:
            - email
        message:
          type: string
          example: Invalid email address

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    
    RefreshResponse:
      type: object
      properties:
        message:
          type: string
          example: Token refreshed successfully
        accessToken:
          type: string
          example: your-access-token

    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          minLength: 8
          example: password123
    UpdateUserRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - user
            - admin
          example: admin

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Login successful
        accessToken:
          type: string
          example: your-access-token
        user:
          $ref: '#/components/schemas/UserResponse'

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Operation successful